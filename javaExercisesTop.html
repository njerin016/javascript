<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        /* using map,filter and reduce methods to find the sum of tripled even numbers of an array*/
        function sumOfTripledEvens(array) {
            return array
                .filter((num) => num % 2 === 0)
                .map((num) => num * 3)
                .reduce((accumulator, current) => accumulator + current);
        }

        function camelize(str) {
            splitedString = str.split("-");
            let capitalizedWords = splitedString.map(function(word, index) {
                if (index == 0) {
                    return word;
                }
                else {
                    return word[0].toUpperCase() + word.slice(1);
                }
            });
            joinedString = capitalizedWords.join("");

            return joinedString;
        }

        function filterRange(arr, a, b) {

            let filteredArray = arr.filter(function(element) {
                if (element >= a && element <= b) {
                    return element;
                }
                else {
                    return;
                }
            })

            return filteredArray;
        }
    </script>
</body>
</html>
